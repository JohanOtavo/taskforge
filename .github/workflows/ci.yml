name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# En un repositorio publico cualquiera puede abrir un PR y ejecutar este
# workflow. Solo necesita leer el codigo: sin esto hereda los permisos por
# defecto del repositorio, que pueden incluir escritura.
permissions:
  contents: read

env:
  # Misma base para migraciones y para los tests: en CI no hay pooler.
  DATABASE_URL: postgresql://taskforge:taskforge@localhost:5432/taskforge_test?schema=public
  DATABASE_URL_DIRECT: postgresql://taskforge:taskforge@localhost:5432/taskforge_test?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskforge -d taskforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Typecheck
        # `next typegen` genera los tipos de ruta que usan las paginas; sin
        # esto `tsc` falla con rutas que no existen todavia en .next/types.
        run: npx next typegen && npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migraciones
        # `deploy`, no `dev`: corre el mismo SQL que produccion, incluidas las
        # restricciones escritas a mano.
        run: npx prisma migrate deploy

      - name: Tests con cobertura
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
